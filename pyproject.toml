[project]
name = "minimax-h3-prompt-rewriter"
version = "0.6.2"
description = "ComfyUI nodes for the LightX2V MiniMax-H3 T2VA Prompt Rewriter LoRA: rewrite a short prompt into a structured MiniMax-H3 audio-video description, fully local."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
    "transformers>=4.57.1",
    "peft>=0.17",
    "accelerate>=1.10",
    "safetensors>=0.5",
    "bitsandbytes>=0.43; platform_system != 'Darwin'",
]

[project.urls]
Repository = "https://github.com/pytraveler/MiniMax-H3-Prompt-Rewriter-ComfyUI"

[tool.comfy]
PublisherId = "darkil"
DisplayName = "MiniMax-H3 Prompt Rewriter"
Icon = "https://avatars.githubusercontent.com/u/72470814"
