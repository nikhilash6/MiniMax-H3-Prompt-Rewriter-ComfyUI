[project]
name = "minimax-h3-prompt-rewriter"
version = "0.7.0"
description = "ComfyUI nodes that rewrite a short prompt into a structured MiniMax-H3 audio-video description, fully local: the LightX2V T2VA Prompt Rewriter LoRA on Qwen3.6-27B, or MiniMax's own writing guide on any small GGUF for T2VA, I2VA, FL2VA, L2VA and Ref2VA."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
    "transformers>=4.57.1",
    "peft>=0.17",
    "accelerate>=1.10",
    "safetensors>=0.5",
    "bitsandbytes>=0.43; platform_system != 'Darwin'",
]

[project.urls]
Repository = "https://github.com/pytraveler/MiniMax-H3-Prompt-Rewriter-ComfyUI"

[tool.comfy]
PublisherId = "darkil"
DisplayName = "MiniMax-H3 Prompt Rewriter"
Icon = "https://avatars.githubusercontent.com/u/72470814"
